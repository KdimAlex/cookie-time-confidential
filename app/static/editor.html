<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Badge editor</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    @font-face {
      font-family: "Orbitron-Black";
      src: url("/fonts/Orbitron-Black.ttf") format("truetype");
      font-weight: 800;
      font-style: normal;
    }
    @font-face {
      font-family: Orbitron;
      src: url("/fonts/Orbitron-Black.ttf") format("truetype");
      font-weight: 800;
      font-style: normal;
    }
  </style>
</head>
<body class="editor">
  <main class="editor-layout">
    <div class="editor-stage">
      <svg id="stage" viewBox="0 0 612 612" role="img" aria-label="Badge layers">
        <g id="base"></g>
        <g id="overlay"></g>
        <g id="guide" pointer-events="none" style="display: none">
          <circle cx="306" cy="306" r="250" fill="none" stroke="#e7c56a" stroke-width="1.25" />
          <path d="M306 291 V321 M291 306 H321" fill="none" stroke="#e7c56a" stroke-width="1.25" />
        </g>
      </svg>
    </div>
    <form class="editor-controls" autocomplete="off">
      <h1>Badge</h1>
      <p class="editor-note">Upper left is the mission. Upper right is the constellation. The bottom circle is how the Align game went. The two lines of type follow the original arcs.</p>
      <label>Top
        <input id="top-text" type="text" maxlength="32" value="MASTER STAR NAVIGATOR" spellcheck="false" />
      </label>
      <label>Bottom
        <input id="bottom-text" type="text" maxlength="24" value="RUSTY SCHWEICKART" spellcheck="false" />
      </label>
      <fieldset data-slot="mission">
        <legend>Mission · upper left</legend>
        <button type="button" data-icon="" aria-pressed="true">Empty</button>
        <button type="button" data-icon="apollobadge.svg">Apollo</button>
        <button type="button" data-icon="skylabbadge.svg">Skylab</button>
        <button type="button" data-icon="mercurybadge.svg">Mercury</button>
        <button type="button" data-icon="geminibadge.svg">Gemini</button>
      </fieldset>
      <fieldset data-slot="constellation">
        <legend>Constellation · upper right</legend>
        <button type="button" data-icon="" aria-pressed="true">Empty</button>
        <button type="button" data-icon="casseopiabadge.svg">Cassiopeia</button>
        <button type="button" data-icon="aquilabadge.svg">Aquila</button>
        <button type="button" data-icon="canusmajorbadge.svg">Canis Major</button>
        <button type="button" data-icon="scorpiusbadge.svg">Scorpius</button>
        <button type="button" data-icon="ursamajorbadge.svg">Ursa Major</button>
      </fieldset>
      <fieldset data-slot="align">
        <legend>Align · bottom</legend>
        <button type="button" data-icon="" aria-pressed="true">Empty</button>
        <button type="button" data-icon="cookiebadge.svg">Score</button>
      </fieldset>
      <fieldset>
        <legend>Layer</legend>
        <button type="button" data-layer="base" aria-pressed="false">Mark</button>
        <button type="button" data-layer="overlay" aria-pressed="true">Names</button>
      </fieldset>
      <label>X <input id="tx" type="number" step="0.5" /></label>
      <label>Y <input id="ty" type="number" step="0.5" /></label>
      <label>Scale <input id="scale" type="number" step="0.01" min="0.05" /></label>
      <label class="editor-check"><input id="show-guide" type="checkbox" /> Ring guide</label>
      <button type="button" id="center">Center on the ring</button>
      <button type="button" id="reset">Reset</button>
      <label class="editor-file">Replace this layer
        <input id="replace" type="file" accept=".svg,image/svg+xml" />
      </label>
      <button type="button" id="download">Download SVG</button>
    </form>
  </main>
  <script src="/editor.js"></script>
</body>
</html>
